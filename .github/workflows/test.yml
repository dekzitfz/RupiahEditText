name: Test

on:
  workflow_call:

jobs:
  test:
    name: Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Run Tests
        run: ./gradlew test

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: Test-Reports
          path: rupiahedittext/build/reports
        if: always()
