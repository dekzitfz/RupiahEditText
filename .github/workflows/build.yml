name: Build

on:
  workflow_call:

jobs:
  test:
    name: Build Source
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: build
        run: ./gradlew :rupiahedittext:assembleDebug
